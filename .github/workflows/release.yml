name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Juicebar ${{ github.ref_name }}
          releaseBody: |
            **Setup (recommended):** `Juicebar_x.y.z_x64-setup.exe` — per-user install, no admin rights.
            **MSI:** for managed deployments.

            The build is not code-signed yet, so Windows SmartScreen may warn: choose *More info → Run anyway*.
          releaseDraft: true
          prerelease: false
